<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Banco</title>
</head>
<body>
    <h1>Simulador de Banco</h1>
    <p>Saldo atual: R$ <span id="saldo">1000</span></p>

    <label for="operacao">Operação:</label>
    <select id="operacao">
        <option value="consultar">Consultar saldo</option>
        <option value="depositar">Depositar</option>
        <option value="sacar">Sacar</option>
        <option value="extrato">Ver extrato</option>
    </select>

    <p>
        <label for="valor">Valor:</label>
        <input type="number" id="valor">
    </p>

    <button id="executar">Executar operação</button>
    <h2>Resultado</h2>
    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
